<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grw — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --surface:#15171C; --surface-2:#1D2026; --line:#262A31;
    --text:#EDEEF0; --text-dim:#8B909A; --text-faint:#565B64;
    --amber:#E8A93B; --amber-dim:#3A2F1A;
    --sage:#4FA37A; --sage-dim:#1B2B22;
    --terracotta:#C4644B; --terracotta-dim:#2E1D18;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:40px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  header{padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; background:var(--bg); z-index:10;}
  header h1{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700;}
  header .sub{font-size:11px; color:var(--text-faint); margin-top:2px;}
  #signOutBtn{background:var(--surface-2); border:1px solid var(--line); color:var(--terracotta); padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit;}

  .container{max-width:1100px; margin:0 auto; padding:24px;}

  /* Auth gate */
  #authGate{max-width:380px; margin:80px auto; padding:0 20px;}
  #authGate h2{font-family:'Space Grotesk',sans-serif; font-size:22px; margin-bottom:6px;}
  #authGate .sub{color:var(--text-faint); font-size:13px; margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); display:block; margin-bottom:6px;}
  .field input{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:11px 13px; border-radius:9px; font-size:14px; font-family:inherit;}
  .btn-primary{width:100%; background:var(--amber); color:#1a1204; border:none; padding:13px; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px;}
  .err{color:var(--terracotta); font-size:12px; margin-top:10px; min-height:16px;}
  .denied{background:var(--terracotta-dim); border:1px solid #4A2E24; border-radius:12px; padding:18px; text-align:center; color:var(--terracotta); font-size:13px;}

  /* Dashboard */
  .stat-row{display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap;}
  .stat-box{flex:1; min-width:140px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .stat-box .n{font-size:24px; font-family:'Space Grotesk',sans-serif; font-weight:700;}
  .stat-box .l{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin-top:4px;}

  .filters{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .filters select, .filters input{background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:9px 12px; border-radius:8px; font-size:13px; font-family:inherit;}

  table{width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
  th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); padding:12px 14px; border-bottom:1px solid var(--line); background:var(--surface-2);}
  td{padding:12px 14px; border-bottom:1px solid var(--line); font-size:13px;}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--surface-2);}
  .badge{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:600;}
  .badge.yes{background:var(--sage-dim); color:var(--sage);}
  .badge.no{background:var(--terracotta-dim); color:var(--terracotta);}
  .badge.na{background:var(--surface-2); color:var(--text-faint);}

  .empty{color:var(--text-faint); font-size:13px; padding:30px; text-align:center;}

  /* Detail modal */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:50; display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 16px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px; width:100%; max-width:640px;}
  .modal h2{font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:4px;}
  .modal .sub{color:var(--text-faint); font-size:12px; margin-bottom:20px;}
  .modal-section{margin-bottom:18px;}
  .modal-section h3{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:10px;}
  .modal-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .modal-row:last-child{border-bottom:none;}
  .modal-row .v{font-family:'IBM Plex Mono',monospace; font-weight:600;}
  .close-btn{background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; cursor:pointer; font-family:inherit; margin-top:8px;}
</style>
</head>
<body>

<div id="authGate">
  <h2>Grw Admin</h2>
  <div class="sub">Enter the admin password to view the team dashboard</div>
  <div class="field"><label>Admin Password</label><input type="password" id="adminPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter') adminSignIn()"></div>
  <button class="btn-primary" onclick="adminSignIn()">Enter</button>
  <div class="err" id="adminAuthErr"></div>
  <button type="button" onclick="loadDemoData()" style="width:100%; background:none; border:1px dashed var(--line); color:var(--text-faint); padding:11px; border-radius:9px; font-size:12.5px; font-family:inherit; margin-top:16px; cursor:pointer;">👁 Preview Demo (no password, sample data)</button>
</div>

<div id="dashboard" style="display:none;">
  <div id="demoBanner" style="display:none; background:var(--amber-dim); color:var(--amber); text-align:center; font-size:12px; padding:8px; font-weight:600;">👁 DEMO MODE — showing sample data, not connected to your Sheet</div>
  <header>
    <div>
      <h1>Grw — Team Overview</h1>
      <div class="sub" id="employeeCount">Loading…</div>
    </div>
    <button id="signOutBtn" onclick="exitDemoOrSignOut()">Sign Out</button>
  </header>

  <div class="container">
    <div class="stat-row" id="topStats"></div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Search by name..." oninput="renderRoster()">
      <select id="roleFilter" onchange="renderRoster()">
        <option value="">All Roles</option>
        <option value="Sales">Sales</option>
        <option value="Retention">Retention</option>
        <option value="Business">Business</option>
        <option value="Operations">Operations</option>
        <option value="Product">Product</option>
      </select>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th><th>Role</th><th>Checked In Today</th><th>POA Today</th><th>Target Achieved</th><th>Pipeline</th><th>Pending</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="detailModalBg" onclick="if(event.target===this) closeDetail()">
  <div class="modal" id="detailModal"></div>
</div>

<script>
/* Admin password + Sheet connection settings: */
/* TODO: set your own admin password here, and paste the same Web App URL used in index.html
   once you deploy AppsScript_PasteIntoSheet.gs. This password is a light convenience gate only —
   the real protection is that nobody else has this admin.html URL or the Sheet's Web App URL. */
const ADMIN_PASSWORD = "Zillout@123";
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbygfZaaSt63iq4O8FT4yKGKRpsgCdG7AEEJj8OliBIk1zEiRttmgcIymxbuUJDQzbY-Dw/exec";

let allEmployees = [];

function fmtMoney(n){ n = Math.round(Number(n)||0); return '₹' + n.toLocaleString('en-IN'); }
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function currentMonthKey(){ return todayKey().slice(0,7); }
const GST_RATE = 0.18;
function stripGst(v){ return (Number(v)||0)/(1+GST_RATE); }
function gross(v){ return (Number(v)||0)*(1+GST_RATE); }

function adminSignIn(){
  const pass = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('adminAuthErr');
  if(pass !== ADMIN_PASSWORD){ errEl.textContent = 'Incorrect password'; return; }
  errEl.textContent = '';
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadAllEmployees();
}
function adminSignOut(){
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('demoBanner').style.display = 'none';
  document.getElementById('authGate').style.display = 'block';
  document.getElementById('adminPassword').value = '';
  allEmployees = [];
}

let isDemoMode = false;
function loadDemoData(){
  isDemoMode = true;
  const today = todayKey();
  const yesterday = (()=>{ const d = new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const mk = currentMonthKey();

  allEmployees = [
    {
      uid: 'demo1',
      profile: {name:'Riya Sharma', desig:'Field Sales Executive', team:'Sales', empId:'EMP001'},
      attendance: [{date:today, time:'09:12 AM'}],
      poaDays: {[today]: [
        {id:'1', text:'Visit Acme Retail', done:true},
        {id:'2', text:'Follow up on renewal', done:true},
        {id:'3', text:'Send proposal to Lotus Traders', done:false}
      ]},
      clients: [
        {name:'Acme Retail', city:'Mumbai', deal:120000, collected:80000, pending:40000, shared:100},
        {name:'Lotus Traders', city:'Pune', deal:65000, collected:65000, pending:0, shared:100}
      ],
      potentials: [{name:'Nova Enterprises', city:'Mumbai', amount:90000}],
      monthlyTargets: {[mk]: {amount:150000}}
    },
    {
      uid: 'demo2',
      profile: {name:'Karan Mehta', desig:'Business Development', team:'Business', empId:'EMP002'},
      attendance: [{date:yesterday, time:'09:45 AM'}],
      poaDays: {[today]: [
        {id:'1', text:'Client renewal call', done:false}
      ]},
      clients: [
        {name:'Zenith Corp', city:'Bengaluru', deal:200000, collected:150000, pending:50000, shared:100}
      ],
      potentials: [],
      monthlyTargets: {[mk]: {amount:180000}}
    },
    {
      uid: 'demo3',
      profile: {name:'Priya Nair', desig:'Field Operations', team:'Operations', empId:'EMP003'},
      attendance: [{date:today, time:'08:55 AM'}],
      poaDays: {[today]: [
        {id:'1', text:'Site inspection — Warehouse B', done:true},
        {id:'2', text:'Vendor meeting', done:true}
      ]},
      clients: [],
      potentials: [],
      visits: [{date:today, clientName:'Warehouse B', metWith:'Site Manager', city:'Chennai'}],
      monthlyTargets: {}
    },
    {
      uid: 'demo4',
      profile: {name:'Aditya Rao', desig:'Retention Specialist', team:'Retention', empId:'EMP004'},
      attendance: [],
      poaDays: {},
      clients: [
        {name:'Bright Solutions', city:'Hyderabad', deal:95000, collected:20000, pending:75000, shared:100}
      ],
      potentials: [{name:'Silverline Co', city:'Hyderabad', amount:40000}],
      monthlyTargets: {[mk]: {amount:100000}}
    }
  ];

  document.getElementById('authGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('demoBanner').style.display = 'block';
  document.getElementById('employeeCount').textContent = `${allEmployees.length} employees (sample data)`;
  renderTopStats();
  renderRoster();
}
function exitDemoOrSignOut(){
  isDemoMode = false;
  adminSignOut();
}

function loadAllEmployees(){
  if(!SHEET_WEBAPP_URL || SHEET_WEBAPP_URL.indexOf('https://script.google.com/macros/s/AKfycbygfZaaSt63iq4O8FT4yKGKRpsgCdG7AEEJj8OliBIk1zEiRttmgcIymxbuUJDQzbY-Dw/exec') === 0){
    document.getElementById('employeeCount').textContent = 'Sheet URL not configured yet — paste it into SHEET_WEBAPP_URL';
    return;
  }
  loadFromSheet();
}
function loadFromSheet(){
  document.getElementById('employeeCount').textContent = 'Loading from Google Sheet…';
  fetch(SHEET_WEBAPP_URL)
    .then(r=>r.json())
    .then(data=>{
      if(!data.ok) throw new Error(data.error || 'Sheet returned an error');
      allEmployees = (data.employees||[]).map(row=>{
        const payload = row.payload || {};
        return {
          uid: row.empId,
          sheetTarget: row.target,
          sheetAchieved: row.achievedAmount,
          sheetPending: row.pendingAmount,
          sheetPipeline: row.pipelineAmount,
          sheetClientNames: row.clientNames,
          sheetClientPending: row.clientPending,
          ...payload
        };
      });
      document.getElementById('employeeCount').textContent = `${allEmployees.length} employee${allEmployees.length===1?'':'s'} synced (Google Sheet)`;
      renderTopStats();
      renderRoster();
    })
    .catch(e=>{
      console.error(e);
      document.getElementById('employeeCount').textContent = 'Failed to load from Sheet — check the Web App URL / deployment';
    });
}

function computeEmpTarget(emp){
  const mk = currentMonthKey();
  const raw = (emp.monthlyTargets||{})[mk];
  const entry = raw==null ? {amount:0} : (typeof raw==='number' ? {amount:raw} : raw);
  const targetBase = Number(entry.amount)||0;
  const targetGross = gross(targetBase);
  let counted=0, pending=0;
  (emp.clients||[]).forEach(c=>{
    const shared = Number(c.shared)||100;
    counted += (Number(c.deal)||0) * (shared/100);
    pending += Number(c.pending)||0;
  });
  const pct = targetGross>0 ? Math.min(100,(counted/targetGross)*100) : 0;
  return {targetBase, targetGross, counted, pending, pct, hasTarget: targetBase>0};
}

function renderTopStats(){
  const today = todayKey();
  const checkedIn = allEmployees.filter(e=> (e.attendance||[]).some(a=>a.date===today)).length;
  let totalPending = 0;
  allEmployees.forEach(e=> (e.clients||[]).forEach(c=> totalPending += Number(c.pending)||0));
  const targetRoles = ['Sales','Retention','Business'];
  const onTarget = allEmployees.filter(e=> targetRoles.includes(e.profile?.team));
  let totalAchieved = 0, totalTarget = 0;
  onTarget.forEach(e=>{ const t = computeEmpTarget(e); totalAchieved += t.counted; totalTarget += t.targetGross; });

  document.getElementById('topStats').innerHTML = `
    <div class="stat-box"><div class="n">${allEmployees.length}</div><div class="l">Total Employees</div></div>
    <div class="stat-box"><div class="n">${checkedIn}</div><div class="l">Checked In Today</div></div>
    <div class="stat-box"><div class="n">${fmtMoney(totalAchieved)}</div><div class="l">Team Achieved (this month)</div></div>
    <div class="stat-box"><div class="n">${fmtMoney(totalPending)}</div><div class="l">Team Pending</div></div>
  `;
}

function renderRoster(){
  const search = (document.getElementById('searchInput').value||'').toLowerCase();
  const roleFilter = document.getElementById('roleFilter').value;
  const today = todayKey();

  let list = allEmployees.filter(e=>{
    const name = (e.profile?.name||'').toLowerCase();
    if(search && !name.includes(search)) return false;
    if(roleFilter && e.profile?.team !== roleFilter) return false;
    return true;
  });

  const body = document.getElementById('rosterBody');
  if(!list.length){
    body.innerHTML = `<tr><td colspan="7" class="empty">No employees match</td></tr>`;
    return;
  }

  body.innerHTML = list.map(e=>{
    const checkedIn = (e.attendance||[]).some(a=>a.date===today);
    const poaToday = (e.poaDays||{})[today] || [];
    const poaDone = poaToday.filter(p=>p.done).length;
    const t = computeEmpTarget(e);
    const hasTarget = e.sheetTarget !== '' && e.sheetTarget != null ? Number(e.sheetTarget)>0 : t.hasTarget;
    const pct = e.sheetTarget && Number(e.sheetTarget)>0 ? (Number(e.sheetAchieved||0)/Number(e.sheetTarget)*100) : t.pct;
    const pendingVal = e.sheetPending !== '' && e.sheetPending != null ? Number(e.sheetPending) : t.pending;
    const pipelineVal = e.sheetPipeline !== '' && e.sheetPipeline != null ? Number(e.sheetPipeline) : 0;
    return `
      <tr class="clickable" onclick="openDetail('${e.uid}')">
        <td>${escapeHtml(e.profile?.name || '(no name)')}</td>
        <td>${escapeHtml(e.profile?.team || '—')}</td>
        <td><span class="badge ${checkedIn?'yes':'no'}">${checkedIn?'Yes':'No'}</span></td>
        <td>${poaDone}/${poaToday.length}</td>
        <td>${hasTarget ? Math.min(100,pct).toFixed(0)+'%' : '<span class="badge na">N/A</span>'}</td>
        <td>${fmtMoney(pipelineVal)}</td>
        <td>${fmtMoney(pendingVal)}</td>
      </tr>`;
  }).join('');
}

function openDetail(uid){
  const e = allEmployees.find(x=>x.uid===uid);
  if(!e) return;
  const t = computeEmpTarget(e);
  const today = todayKey();
  const poaToday = (e.poaDays||{})[today] || [];
  const clients = e.clients || [];
  const potentials = e.potentials || [];
  const visits = (e.visits||[]).filter(v=>v.date===today);

  const modal = document.getElementById('detailModal');
  modal.innerHTML = `
    <h2>${escapeHtml(e.profile?.name || '(no name)')}</h2>
    <div class="sub">${escapeHtml(e.profile?.desig||'')} · ${escapeHtml(e.profile?.team||'')} · ID ${escapeHtml(e.profile?.empId||'—')}</div>

    <div class="modal-section">
      <h3>Target & Incentive (this month)</h3>
      ${t.hasTarget ? `
        <div class="modal-row"><span>Target</span><span class="v">${fmtMoney(e.sheetTarget || t.targetGross)}</span></div>
        <div class="modal-row"><span>Achieved</span><span class="v">${fmtMoney(e.sheetAchieved || t.counted)}</span></div>
        <div class="modal-row"><span>Progress</span><span class="v">${t.pct.toFixed(0)}%</span></div>
        <div class="modal-row"><span>Pipeline (Potential)</span><span class="v">${fmtMoney(e.sheetPipeline || 0)}</span></div>
        <div class="modal-row"><span>Pending Collection</span><span class="v">${fmtMoney(e.sheetPending || t.pending)}</span></div>
      ` : `<div class="modal-row"><span>No target set for this role/month</span></div>`}
    </div>

    <div class="modal-section">
      <h3>Today</h3>
      <div class="modal-row"><span>Checked In</span><span class="v">${(e.attendance||[]).some(a=>a.date===today) ? 'Yes' : 'No'}</span></div>
      <div class="modal-row"><span>POA Completed</span><span class="v">${poaToday.filter(p=>p.done).length}/${poaToday.length}</span></div>
      ${visits.length ? `<div class="modal-row"><span>Site Visits</span><span class="v">${visits.length}</span></div>` : ''}
    </div>

    <div class="modal-section">
      <h3>Clients (${clients.length})</h3>
      ${clients.length ? clients.map(c=>`
        <div class="modal-row"><span>${escapeHtml(c.name)}${c.city?' — '+escapeHtml(c.city):''}</span><span class="v">${fmtMoney(c.collected)} / ${fmtMoney(c.deal)}</span></div>
      `).join('') : `<div class="modal-row"><span>No clients yet</span></div>`}
    </div>

    <div class="modal-section">
      <h3>Potential Clients (${potentials.length})</h3>
      ${potentials.length ? potentials.map(p=>`
        <div class="modal-row"><span>${escapeHtml(p.name)}${p.city?' — '+escapeHtml(p.city):''}</span><span class="v">${fmtMoney(p.amount)}</span></div>
      `).join('') : `<div class="modal-row"><span>No potential clients</span></div>`}
    </div>

    <button class="close-btn" onclick="closeDetail()">Close</button>
  `;
  document.getElementById('detailModalBg').classList.add('open');
}
function closeDetail(){
  document.getElementById('detailModalBg').classList.remove('open');
}
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
